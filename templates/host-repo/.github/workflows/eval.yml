name: eval

# Evaluating the machine's configuration is cheap (no build) and catches what a
# bad input bump or a typo would otherwise surface as a failed upgrade on the
# machine itself. The machine keeps running its last good generation either way;
# this just says so here first.
on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate nixosConfigurations.default
        run: nix eval --raw .#nixosConfigurations.default.config.system.build.toplevel.drvPath

  # Dependabot's flake.lock bumps merge themselves once the configuration still
  # evaluates; anything else waits for a human.
  merge-dependabot:
    needs: eval
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
